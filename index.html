<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://msp-operations.github.io/MSP-FAQ-s/">
  <link rel="canonical" href="https://msp-operations.github.io/MSP-FAQ-s/">
  <title>MSP Student FAQ has moved</title>
  <script>
    // Clean up the old PWA so returning visitors are moved to the new address.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    }
    location.replace('https://msp-operations.github.io/MSP-FAQ-s/');
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b2a4a; color: #fff;
      display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; text-align: center; }
    a { color: #fff; }
  </style>
</head>
<body>
  <div>
    <p>The MSP Student FAQ has moved.</p>
    <p><a href="https://msp-operations.github.io/MSP-FAQ-s/">Continue to the new site</a></p>
  </div>
</body>
</html>
